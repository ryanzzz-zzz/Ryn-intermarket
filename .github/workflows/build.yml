name: Build APK from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Ekstrak ZIP
        run: unzip -q RynXIntermarket.zip
      - name: Build debug APK
        working-directory: RynXIntermarket
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RynXIntermarket-debug-apk
          path: RynXIntermarket/app/build/outputs/apk/debug/*.apk
